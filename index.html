<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TRAIN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRAIN">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: "blocchi di colore". Fondo quasi nero fisso, un colore pieno per ogni tipo di allenamento (testo nero sopra),
   Archivo stretta e maiuscola per i titoli, pillole e tasselli arrotondati, barra delle schede in basso. */
:root{
  --bg:#111111; --surface:#1C1C1C; --surface2:#262626; --line:#303030;
  --ink:#F3F0E8; --ink2:#C9C5BC; --ink3:#928E86; --on:#0D0D0D;
  --cream:#F3F0E8;
  /* un colore per tipo di sessione: allenamento ARYA, mobility/drenaggio, corsa, archivio Carol.
     Il programma ARYA non ha un colore: si legge dalla sigla (AOF, T&D...) */
  --c-arya:#FF5240; --c-soft:#F59AC6; --c-run:#B8E06A; --c-archive:#8A867F;
  /* accenti dell'interfaccia */
  --c-strong:#B9A6F5; --c-fire:#FF6B57; --c-carol:#F2C94C;
  --star:#F2C94C;
  /* nomi della versione precedente, ancora usati dentro il codice */
  --coral:var(--c-fire); --coral-light:var(--line); --coral-pale:var(--surface2);
  --border:var(--line); --white:var(--surface); --green:var(--c-run);
  --font:"Archivo",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:var(--font)}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}

/* testata: il titolo stretto e altissimo */
.header{background:var(--bg);color:var(--ink);padding:calc(1.4rem + env(safe-area-inset-top,0px)) max(1.1rem,env(safe-area-inset-right,0px)) .6rem max(1.1rem,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.header-label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:.35rem}
.header h1{font-stretch:68%;font-weight:850;text-transform:uppercase;font-size:clamp(2.9rem,15vw,5.2rem);line-height:.86;letter-spacing:-.005em}
.header h1 strong{font-weight:850;color:var(--c-strong)}
.header-pills{display:flex;gap:6px;margin-top:.9rem;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--on);border-radius:999px;padding:5px 11px}
.header-pills .pill:nth-child(1){background:var(--c-arya)}
.header-pills .pill:nth-child(2){background:var(--c-run)}
.header-pills .pill:nth-child(3){background:var(--c-soft)}

/* barra delle schede in basso, a pillola */
.tabs-wrap{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:20;max-width:700px;margin:0 auto;display:flex;gap:3px;padding:5px;border-radius:999px;background:rgba(28,28,28,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:42px;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;border:none;border-radius:999px;background:none;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--cream);color:var(--on)}

.main{max-width:720px;margin:0 auto;padding:1rem max(1.1rem,env(safe-area-inset-right,0px)) calc(6.5rem + var(--safe-b)) max(1.1rem,env(safe-area-inset-left,0px))}

/* intestazione di una scheda */
.session-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:.4rem 0 1.1rem;flex-wrap:wrap}
.session-info h2{font-stretch:68%;font-weight:850;text-transform:uppercase;font-size:2.3rem;line-height:.9;color:var(--ink)}
.session-info p{font-size:13px;color:var(--ink3);margin-top:6px}
.date-wrap{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.date-wrap label{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.date-wrap input[type=date]{font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}

.prog-wrap{margin-bottom:1.25rem}
.prog-labels{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:6px}
.prog-bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:var(--c-run);border-radius:999px;transition:width .35s}

/* blocchi di esercizi */
.card{background:var(--surface);border:0;border-radius:22px;overflow:hidden;margin-bottom:10px}
.card-head{padding:.9rem 1.1rem .5rem;border-bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-badge{font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--c-carol);color:var(--on);border:0;padding:3px 9px;border-radius:999px;flex-shrink:0}
.card-title{font-stretch:75%;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.card-note{font-size:11px;color:var(--ink3);margin-left:auto}

.ex{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:.8rem 1.1rem;border-top:1px solid var(--line);align-items:start}
.chk{width:26px;height:26px;border:2px solid var(--ink3);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:0;background:transparent;transition:all .15s}
.chk:hover{border-color:var(--ink)}
.chk.done{background:var(--c-run);border-color:var(--c-run)}
.chk-icon{display:none}
.chk.done .chk-icon{display:block;width:10px;height:10px}
.chk.done .chk-icon::after{content:'';display:block;width:5px;height:10px;border:2.5px solid var(--on);border-top:none;border-left:none;transform:rotate(45deg) translate(0,-2px)}
.ex-name{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.3}
.ex-name.done{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink3)}
.ex-desc{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.ex-desc b{font-weight:700;color:var(--c-carol)}
.ex-fields{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px}
.fld-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.fld input{font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);width:140px}
.fld input:focus{outline:none;border-color:var(--cream)}

/* com'è andata */
.feel-card{background:var(--surface);border:0;border-radius:22px;padding:1.1rem;margin-bottom:10px}
.feel-title{font-stretch:75%;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:.8rem}
.stars-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;flex-wrap:wrap}
.stars-label{font-size:13px;color:var(--ink2)}
.stars{display:flex;gap:4px}
.star{font-size:28px;cursor:pointer;color:var(--surface2);line-height:1;user-select:none;transition:color .1s, transform .1s}
.star:active{transform:scale(.9)}
.star.on{color:var(--star)}
textarea.note-area{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);color:var(--ink);resize:vertical;min-height:84px;line-height:1.5}
textarea.note-area:focus{outline:none;border-color:var(--cream)}

/* pulsanti */
.actions{display:flex;align-items:center;gap:8px;margin-top:1rem;flex-wrap:wrap}
.btn{font-size:14px;font-weight:700;min-height:46px;padding:0 22px;border-radius:999px;cursor:pointer;transition:transform .1s, background .15s;border:2px solid}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--cream);color:var(--on);border-color:var(--cream)}
.btn-primary:hover{background:#fff}
.btn-secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--ink3)}
.saved-ok{font-size:13px;font-weight:700;color:var(--c-run);opacity:0;transition:opacity .3s}
.saved-ok.show{opacity:1}

/* storico */
.hist-section{margin-top:1.6rem}
.hist-title{font-stretch:75%;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-bottom:.7rem}
.hist-empty{font-size:13px;color:var(--ink3);font-style:italic}
.hist-item{background:var(--surface);border:0;border-radius:24px;padding:.8rem .8rem .8rem 1.15rem;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--ink)}
.hist-date{font-size:16px;font-weight:800}
.hist-meta{font-size:12px;color:var(--ink3);margin-top:1px}
.hist-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hist-stars{font-size:13px;color:var(--star)}
.btn-small{font-size:12px;font-weight:700;min-height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--on);color:var(--ink);cursor:pointer}
.btn-small:hover{background:#000}

.info-box{background:var(--surface);border:0;border-radius:22px;padding:1.1rem;margin-top:10px}
.info-box-title{font-stretch:75%;font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c-carol);margin-bottom:.6rem}
.info-box ul{list-style:none;padding:0}
.info-box li{font-size:13px;color:var(--ink2);padding:3px 0 3px 16px;position:relative;line-height:1.45}
.info-box li::before{content:'';position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--c-carol)}

/* corsa */
.run-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.run-stat{background:var(--surface);border:0;border-radius:22px;padding:1rem 1.1rem}
.run-stat-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:.4rem}
.run-stat-input{font-stretch:68%;font-size:2.4rem;font-weight:800;color:var(--ink);width:100%;border:none;background:transparent;outline:none;padding:0}
.run-stat-input::placeholder{color:var(--surface2);font-size:2.2rem}
.run-stat-unit{font-size:11px;color:var(--ink3);margin-top:2px}
.run-stat.computed{background:var(--c-run);color:var(--on)}
.run-stat.computed .run-stat-label,.run-stat.computed .run-stat-unit{color:var(--on);opacity:.7}
.run-stat.computed .run-stat-value{font-stretch:68%;font-size:2.4rem;font-weight:800;color:var(--on)}
.run-type-row{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.run-type-btn{font-size:13px;font-weight:700;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer;transition:all .15s}
.run-type-btn.active{background:var(--c-run);border-color:var(--c-run);color:var(--on)}

/* accesso */
#login-box{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:1.5rem}
#login-form{background:var(--surface);border-radius:26px;padding:1.6rem;max-width:380px;width:100%;display:flex;flex-direction:column;gap:.9rem}
.login-title{font-stretch:68%;font-weight:850;text-transform:uppercase;font-size:2.2rem;line-height:.9}
#login-form p{font-size:13px;color:var(--ink2)}
#login-form label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
#login-form input{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink)}
#login-err{font-size:13px;color:var(--c-fire)}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;margin-top:.7rem}
.sync-pill.synced{background:rgba(184,224,106,.14);color:var(--c-run)}
.sync-pill.syncing{background:rgba(242,201,76,.14);color:var(--c-carol)}
.sync-pill.offline{background:var(--surface);color:var(--ink3)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Panoramica: numeri e calendario */
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.2rem}
.home-stat{background:var(--surface);border:0;border-radius:22px;padding:1rem .8rem;text-align:left}
.home-stat:nth-child(1){background:var(--c-strong);color:var(--on)}
.home-stat-val{font-stretch:68%;font-size:2.6rem;font-weight:850;color:inherit;line-height:.9}
.home-stat-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:inherit;opacity:.7;margin-top:6px}

.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.cal-nav-title{font-stretch:68%;font-size:1.9rem;font-weight:850;text-transform:uppercase;color:var(--ink)}
.cal-nav-btn{background:var(--surface);border:0;border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .15s}
.cal-nav-btn:hover{background:var(--surface2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:1rem}
.cal-dow{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:center;padding-bottom:4px}
.cal-day{min-height:52px;border-radius:14px;border:2px solid transparent;padding:6px 3px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .12s, border-color .12s;position:relative;background:var(--surface)}
.cal-day:hover{border-color:var(--ink3)}
.cal-day.today{border-color:var(--cream)!important}
.cal-day.selected{border-color:var(--cream);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--cream)}
.cal-day.empty{cursor:default;pointer-events:none;background:transparent}
.cal-day.other-month{background:transparent}
.cal-day.other-month .cal-num{color:var(--surface2)}
.cal-num{font-size:13px;font-weight:700;color:var(--ink2);line-height:1}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cal-rest-badge{position:static;order:3;margin-top:1px;width:15px;height:15px;border-radius:50%;background:var(--surface2);color:var(--ink2);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
/* il tassello prende il colore della sessione del giorno; i pallini diventano scuri per contare le sessioni.
   Se nello stesso giorno ci sono più tipi vince l'ultima regola: archivio < mobility < allenamento < corsa */
.cal-day:not(.other-month):has(.dot-carol){background:var(--c-archive)}
.cal-day:not(.other-month):has(.dot-soft){background:var(--c-soft)}
.cal-day:not(.other-month):has(.dot-arya){background:var(--c-arya)}
.cal-day:not(.other-month):has(.dot-s5){background:var(--c-run)}
.cal-day:not(.other-month):has(.cal-dot) .cal-num{color:var(--on)}
.cal-day:not(.other-month):has(.cal-dot) .cal-dot{background:var(--on)!important;opacity:.55}
.cal-day:not(.other-month):has(.cal-dot) .cal-rest-badge{background:var(--on);color:var(--ink)}
/* sigla del programma ARYA dentro il tassello (AOF, T&D...) */
.cal-tag{font-stretch:75%;font-size:9px;font-weight:850;letter-spacing:.02em;line-height:1;color:var(--ink2);white-space:nowrap}
.cal-day:not(.other-month):has(.cal-dot) .cal-tag{color:var(--on)}
.cal-day.other-month .cal-tag{color:var(--surface2)}
/* giorni con più sessioni: una fascia orizzontale per sessione (il colore viene dalla classe dot-...), separate da una linea scura */
.cal-day.split:not(.other-month):has(.cal-band){padding:0;gap:2px;background:var(--bg);overflow:hidden;border:0}
.cal-day.split.today,.cal-day.split.selected{outline:2px solid var(--cream);outline-offset:-2px}
.cal-band{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:4px;min-height:0}
.cal-band .cal-num,.cal-band .cal-tag{color:var(--on)}
.cal-band .cal-rest-badge{width:13px;height:13px;font-size:8px;margin:0;background:var(--on);color:var(--ink)}

/* i colori dei tipi di sessione (pallini, legenda, Storico) */
.dot-arya{background:var(--c-arya)}
.dot-soft{background:var(--c-soft)}
.dot-carol{background:var(--c-archive)}
.dot-s5{background:var(--c-run)}

/* nello Storico e nel giorno scelto, ogni sessione diventa una pillola del suo colore */
.hist-item:has(.cal-dot),.day-sess:has(.day-sess-dot){color:var(--on)}
.hist-item:has(.dot-arya),.day-sess:has(.dot-arya){background:var(--c-arya)}
.hist-item:has(.dot-soft),.day-sess:has(.dot-soft){background:var(--c-soft)}
.hist-item:has(.dot-carol),.day-sess:has(.dot-carol){background:var(--c-archive)}
.hist-item:has(.dot-s5),.day-sess:has(.dot-s5){background:var(--c-run)}
/* sigla del programma accanto al nome della sessione */
.sess-tag{display:inline-block;font-size:10px;font-weight:850;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:rgba(13,13,13,.16);margin-left:6px;vertical-align:1px}
/* link discreto all'archivio, in fondo alla Panoramica */
.archive-link{display:block;margin:1.6rem auto 0;background:none;border:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);cursor:pointer;padding:10px 14px}
.archive-link:hover{color:var(--ink)}
.hist-item:has(.cal-dot) .cal-dot,.day-sess .day-sess-dot{display:none}
.hist-item:has(.cal-dot) .hist-meta,.hist-item:has(.cal-dot) .hist-stars,.day-sess .day-sess-meta,.day-sess .day-sess-stars{color:var(--on);opacity:.75}
.hist-item:has(.cal-dot) *:not(.btn-small),.day-sess:has(.day-sess-dot) *:not(.day-sess-goto){color:var(--on)!important}
.hist-item:has(.cal-dot) [style*="italic"],.day-sess:has(.day-sess-dot) [style*="italic"]{opacity:.7}

/* ARYA */
.arya-card{background:var(--surface);border:0;border-radius:22px;padding:1rem 1.1rem;margin-bottom:10px}
.arya-card-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:.45rem}
.arya-card input,.arya-card select,.arya-card textarea{width:100%;font-size:16px;border:none;background:transparent;outline:none;padding:0;color:var(--ink)}
.arya-card select{cursor:pointer;font-weight:600}
.arya-card select option{background:var(--surface);color:var(--ink)}
.arya-card textarea{font-size:15px;resize:vertical;min-height:84px;line-height:1.5}
.arya-card.compact-row{display:flex;gap:1rem;align-items:center}
.arya-card.compact-row > div{flex:1}
.arya-day-badge{display:inline-block;background:var(--c-arya);color:var(--on);font-family:var(--font);font-stretch:100%;font-size:11px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:999px;margin-left:8px;vertical-align:middle;text-transform:none}

/* il giorno scelto nel calendario */
.day-detail{background:var(--surface);border:0;border-radius:22px;padding:1.1rem;margin-bottom:10px}
.day-detail-date{font-stretch:68%;font-size:1.6rem;font-weight:850;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);margin-bottom:.7rem}
.day-sess{display:flex;align-items:center;gap:10px;padding:.8rem .8rem .8rem 1.1rem;border:0;border-radius:22px;margin-bottom:7px;background:var(--surface2)}
.day-sess-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.day-sess-name{font-size:15px;font-weight:800;color:inherit;flex:1}
.day-sess-meta{font-size:12px;color:var(--ink3)}
.day-sess-stars{font-size:12px;color:var(--star)}

function isLocalKey(k) { return k.indexOf('date_') === 0; }

function setSyncPill(status, text) {

function persistLocal() {

    localStorage.setItem(LS_KEY, JSON.stringify(state));
    localStorage.setItem(LS_SYNCED, JSON.stringify(synced));
  } catch(e) {}
}

function sameVal(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function dirtyKeys() {
  var ks = {}, k;
  for (k in state) if (!isLocalKey(k) && !sameVal(state[k], synced[k])) ks[k] = 1;
  for (k in synced) if (!(k in state)) ks[k] = 1;
  return Object.keys(ks);
}

// database -> qui, senza toccare le voci cambiate qui e non ancora inviate. Dice se è cambiato qualcosa.
async function pull() {
  var r = await sb.from('train').select('id,data').limit(10000);
  if (r.error) throw r.error;
  var dirty = {}; dirtyKeys().forEach(function(k) { dirty[k] = 1; });
  var remote = {}, changed = false, k;
  r.data.forEach(function(x) { remote[x.id] = x.data; });
  for (k in remote) if (!dirty[k] && !sameVal(state[k], remote[k])) { state[k] = remote[k]; changed = true; }
  for (k in synced) if (!(k in remote) && !dirty[k] && (k in state)) { delete state[k]; changed = true; }
  synced = remote;
  persistLocal();
  return changed;
}

// qui -> database, solo le voci cambiate
var _pushing = false, _pushAgain = false;
async function push() {
  if (_pushing) { _pushAgain = true; return; }
  _pushing = true;
  try {
    do {
      _pushAgain = false;
      var ks = dirtyKeys();
      if (!ks.length) break;
      var up = [], del = [];
      ks.forEach(function(k) {
        if (k in state) up.push({id: k, data: JSON.parse(JSON.stringify(state[k])), updated_at: new Date().toISOString()});
        else del.push(k);
      });
      if (up.length) { var r = await sb.from('train').upsert(up); if (r.error) throw r.error; }
      if (del.length) { var r2 = await sb.from('train').delete().in('id', del); if (r2.error) throw r2.error; }
      up.forEach(function(x) { synced[x.id] = x.data; });
      del.forEach(function(k) { delete synced[k]; });
      persistLocal();
    } while (_pushAgain);
  } finally { _pushing = false; }
}

  sb.auth.getSession().then(function(res) {
    if (res.data && res.data.session) syncNow(true);
    else showLogin();
  }).catch(function() { setSyncPill('offline', 'Offline — dati locali'); });
}

function syncNow(firstTime) {
  if (!sb) { setSyncPill('offline', 'Nessuna connessione'); return; }
  setSyncPill('syncing', 'Sincronizzazione...');
  push().then(pull).then(function(changed) {
    setSyncPill('synced', 'Sincronizzato');
    if (changed || firstTime === true) rerender();
  }).catch(function(e) {
    console.warn('TRAIN: sincronizzazione rimandata', e);
    setSyncPill('offline', navigator.onLine ? 'Errore sync — salvato in locale' : 'Offline — dati locali');
  });
}

var _pushTimer = null;
function saveLocalOnly() {
  // Salva subito su questo dispositivo; dopo qualche secondo invia anche al database
  persistLocal();
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(function() { if (sb) push().catch(function() {}); }, 4000);
}

function saveState() {
  // Salva su questo dispositivo e invia subito al database
  persistLocal();
  if (!sb) return;
  setSyncPill('syncing', 'Salvataggio...');
  push().then(function() {
    setSyncPill('synced', 'Sincronizzato');
  }).catch(function() {

}

function countDone(sid, date, blocks) {
  var sd = getSess(sid, date);
  var tot = 0, done = 0;
  for (var i = 0; i < blocks.length; i++) {
    for (var j = 0; j < blocks[i].exercises.length; j++) {
      tot++;
      if (sd.done && sd.done[blocks[i].title + '_' + j]) done++;
    }
  }
  return {tot: tot, done: done};
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

var ARYA_PROGRAMS = [
  {match:'fire',     tag:'AOF', name:'On Fire'},
  {match:'tonifica', tag:'T&D', name:'Tonifica & Drena'},
  {match:'strong',   tag:'AS',  name:'Strong'},

];
// Categorie che non sono "veri e propri allenamenti": la sessione diventa rosa
var SOFT_CATS = ['Mobility / Stretching','Drenaggio / Linfodrenante','Yoga','Postural'];

function aryaTag(sd) {
  var txt = ((sd && sd.program) || '').toLowerCase();
  for (var i = 0; i < ARYA_PROGRAMS.length; i++) {
    if (txt.indexOf(ARYA_PROGRAMS[i].match) !== -1) return ARYA_PROGRAMS[i].tag;
  }
  return '';
}

function dotClass(id, sd) {
  if (id === 'arya') return (sd && SOFT_CATS.indexOf(sd.category) !== -1) ? 'dot-soft' : 'dot-arya';
  if (CAROL_IDS.indexOf(id) !== -1) return 'dot-carol';
  return SCHED_META[id].color;
}

// sigle dei programmi ARYA del giorno, senza doppioni, da mettere nel tassello del calendario
function calTags(sessions) {
  var tags = [];
  for (var i = 0; i < sessions.length; i++) {
    if (sessions[i].id !== 'arya') continue;
    var t = aryaTag(sessions[i].sd);
    if (t && tags.indexOf(t) === -1) tags.push(t);
  }
  var html = '';
  for (var j = 0; j < tags.length; j++) html += '<span class="cal-tag">' + esc(tags[j]) + '</span>';
  return html;
}

// giorni con più sessioni: il tassello si divide in fasce orizzontali, una per sessione, ognuna col suo colore e la sua sigla.
// Dall'alto: le sessioni ARYA nell'ordine in cui sono state segnate, poi la corsa, poi l'archivio Carol
function calSplitBands(sessions, day, rest) {
  var rank = function(s) { return s.id === 'arya' ? (s.idx || 1) : (s.id === 's5' ? 100 : 200); };
  var list = sessions.slice().sort(function(a, b) { return rank(a) - rank(b); });
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var t = (list[i].id === 'arya') ? aryaTag(list[i].sd) : '';
    html += '<div class="cal-band ' + dotClass(list[i].id, list[i].sd) + '">';
    if (i === 0) html += '<span class="cal-num">' + day + '</span>';
    if (t) html += '<span class="cal-tag">' + esc(t) + '</span>';
    if (rest && i === list.length - 1) html += '<span class="cal-rest-badge">R</span>';
    html += '</div>';
  }
  return html;
}

function getSessionsOnDate(dateStr) {
  var out = [];
  // Schede classiche (s1-s4) e Corsa (s5): una sessione per giorno per scheda
  var ids = ['s1','s2','s3','s4','s5'];
  for (var i=0;i<ids.length;i++) {
    var k = ids[i] + '__' + dateStr;
    if (state[k]) {
      var sd = state[k];
      var hasData = false;
      if (sd.rating && sd.rating > 0) hasData = true;
      if (sd.note && sd.note.trim()) hasData = true;
      if (ids[i] === 's5' && (sd.km || sd.pace)) hasData = true;
      if (sd.done) { for (var dk in sd.done) { if (sd.done[dk]) { hasData = true; break; } } }
      if (hasData) out.push({id: ids[i], sd: sd});
    }
  }
  // ARYA: scansiona TUTTE le chiavi del giorno (anche multiple sessioni)
  for (var k2 in state) {
    var mA = k2.match(/^arya__(\d{4}-\d{2}-\d{2})(?:__(\d+))?$/);
    if (!mA) continue;
    if (mA[1] !== dateStr) continue;
    var sdA = state[k2];
    if (aryaSessionHasData(sdA)) {
      out.push({id: 'arya', sd: sdA, idx: mA[2] ? parseInt(mA[2]) : 1});
    }
  }
  return out;
}

  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var DOWS   = ['Lu','Ma','Me','Gi','Ve','Sa','Do'];

  // build set of all session dates for stats
  var allDates = {};
  var sessionsByDate = {};
  for (var k in state) {
    var m = k.match(/^(?:s\d+|arya)__(\d{4}-\d{2}-\d{2})(?:__\d+)?$/);
    if (m) {
      if (!(m[1] in sessionsByDate)) sessionsByDate[m[1]] = getSessionsOnDate(m[1]).length;
      if (sessionsByDate[m[1]]) allDates[m[1]] = true;
    }
  }
  // Conta TUTTE le sessioni (anche multiple stesso giorno per ARYA)
  var totalSessions = 0;
  for (var d2 in allDates) totalSessions += sessionsByDate[d2];

  // sessions this month
  var monthSess = 0;
  var monthPrefix = calYear + '-' + (calMonth+1<10?'0':'') + (calMonth+1);
  for (var d in allDates) { if (d.indexOf(monthPrefix) === 0) monthSess += sessionsByDate[d]; }

  // current streak
  var streak = 0;
  var cur = new Date(today);
  while (true) {
    var ds = cur.toISOString().slice(0,10);
    if (getSessionsOnDate(ds).length > 0) { streak++; cur.setDate(cur.getDate()-1); }
    else break;
    if (streak > 365) break;
  }

  var html = '';

  // stats row
  html += '<div class="home-stats">';
  html += '<div class="home-stat"><div class="home-stat-val">' + totalSessions + '</div><div class="home-stat-label">Sessioni totali</div></div>';
  html += '<div class="home-stat"><div class="home-stat-val">' + monthSess + '</div><div class="home-stat-label">Questo mese</div></div>';
  html += '<div class="home-stat"><div class="home-stat-val">' + streak + '</div><div class="home-stat-label">Streak giorni</div></div>';
  html += '</div>';

  // calendar nav
  html += '<div class="cal-nav">';
  html += '<button class="cal-nav-btn" onclick="calPrevMonth()">&#8249;</button>';
  html += '<div class="cal-nav-title">' + MONTHS[calMonth] + ' ' + calYear + '</div>';
  html += '<button class="cal-nav-btn" onclick="calNextMonth()">&#8250;</button>';
  html += '</div>';

  // grid header
  html += '<div class="cal-grid">';
  for (var di=0;di<7;di++) html += '<div class="cal-dow">' + DOWS[di] + '</div>';

  // first day of month (Mon=0)
  var firstDay = new Date(calYear, calMonth, 1);
  var startDow = (firstDay.getDay() + 6) % 7; // Mon-based
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var daysInPrev  = new Date(calYear, calMonth, 0).getDate();

  // prev month padding
  for (var pi=startDow-1; pi>=0; pi--) {
    var prevD = daysInPrev - pi;
    var prevMonth = calMonth === 0 ? 11 : calMonth-1;
    var prevYear  = calMonth === 0 ? calYear-1 : calYear;
    var prevStr   = prevYear + '-' + (prevMonth+1<10?'0':'') + (prevMonth+1) + '-' + (prevD<10?'0':'') + prevD;
    var prevSess  = getSessionsOnDate(prevStr);
    html += '<div class="cal-day other-month" onclick="showDayDetail(\'' + prevStr + '\')">';
    html += '<span class="cal-num">' + prevD + '</span>';
    if (prevSess.length) {
      html += '<div class="cal-dots">';
      for (var pi2=0;pi2<prevSess.length;pi2++) html += '<div class="cal-dot ' + dotClass(prevSess[pi2].id, prevSess[pi2].sd) + '"></div>';
      html += '</div>';
      html += calTags(prevSess);
    }
    if (isRestDay(prevStr)) html += '<div class="cal-rest-badge">R</div>';
    html += '</div>';
  }

  // current month days
  for (var day=1; day<=daysInMonth; day++) {
    var dateStr = calYear + '-' + (calMonth+1<10?'0':'') + (calMonth+1) + '-' + (day<10?'0':'') + day;
    var sessions = getSessionsOnDate(dateStr);
    var isToday  = dateStr === today;
    var isSplit  = sessions.length > 1;
    html += '<div class="cal-day' + (isToday?' today':'') + (isSplit?' split':'') + '" onclick="showDayDetail(\'' + dateStr + '\')">';
    if (isSplit) {
      html += calSplitBands(sessions, day, isRestDay(dateStr));
      html += '</div>';
      continue;
    }
    html += '<span class="cal-num">' + day + '</span>';
    if (sessions.length) {
      html += '<div class="cal-dots">';
      for (var si=0;si<sessions.length;si++) html += '<div class="cal-dot ' + dotClass(sessions[si].id, sessions[si].sd) + '"></div>';
      html += '</div>';
      html += calTags(sessions);
    }
    if (isRestDay(dateStr)) html += '<div class="cal-rest-badge">R</div>';
    html += '</div>';
  }

  // next month padding
  var filled = startDow + daysInMonth;
  var remaining = filled % 7 === 0 ? 0 : 7 - (filled % 7);
  for (var ni=1; ni<=remaining; ni++) {
    var nextMonth = calMonth === 11 ? 0 : calMonth+1;
    var nextYear  = calMonth === 11 ? calYear+1 : calYear;
    var nextStr   = nextYear + '-' + (nextMonth+1<10?'0':'') + (nextMonth+1) + '-' + (ni<10?'0':'') + ni;
    html += '<div class="cal-day other-month" onclick="showDayDetail(\'' + nextStr + '\')">';
    html += '<span class="cal-num">' + ni + '</span>';
    if (isRestDay(nextStr)) html += '<div class="cal-rest-badge">R</div>';
    html += '</div>';
  }

  html += '</div>'; // cal-grid

  // legend: i colori dicono il tipo di sessione, le sigle il programma ARYA
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.5rem">';
  var legendItems = [
    {cls:'dot-arya', name:'Allenamento ARYA'},
    {cls:'dot-soft', name:'Mobility / drenaggio'},
    {cls:'dot-s5',   name:'Corsa'}
  ];
  // le vecchie sessioni Carol compaiono in legenda solo nei mesi in cui ci sono
  if (html.indexOf(' dot-carol') !== -1) legendItems.push({cls:'dot-carol', name:'Archivio Carol'});
  for (var li=0;li<legendItems.length;li++) {
    html += '<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3)">';
    html += '<div class="cal-dot ' + legendItems[li].cls + '"></div>' + legendItems[li].name + '</div>';
  }
  html += '</div>';
  var tagLegend = [];
  for (var lp=0;lp<ARYA_PROGRAMS.length;lp++) tagLegend.push('<b style="color:var(--ink2)">' + esc(ARYA_PROGRAMS[lp].tag) + '</b> ' + ARYA_PROGRAMS[lp].name);
  html += '<div style="font-size:11px;color:var(--ink3);margin-bottom:1.25rem">' + tagLegend.join(' &middot; ') + '</div>';

  // day detail placeholder
  html += '<div id="day-detail-wrap"></div>';

  // l'archivio Carol non sta più nella barra in basso: si apre da qui
  html += '<button class="archive-link" onclick="switchTab(carolCurrentSub)">📦 Archivio</button>';

  document.getElementById('main-content').innerHTML = html;
}

function showDayDetail(dateStr) {
  var sessions = getSessionsOnDate(dateStr);
  var wrap = document.getElementById('day-detail-wrap');
  if (!wrap) return;
  var p = dateStr.split('-');
  var fmt = p[2] + '/' + p[1] + '/' + p[0];
  var html = '<div class="day-detail">';
  html += '<div class="day-detail-date">' + fmt + '</div>';
  if (!sessions.length) {
    html += '<div style="font-size:13px;color:var(--ink3);font-style:italic">Nessuna sessione registrata.</div>';
  } else {
    for (var i=0;i<sessions.length;i++) {
      var s = sessions[i];
      var meta = SCHED_META[s.id];
      var r = s.sd.rating || 0;
      var stars = r ? '★'.repeat(r) : '';
      var extra = '';
      if (s.id === 's5') {
        if (s.sd.km) extra += s.sd.km + ' km';
        if (s.sd.pace) extra += (extra?' · ':'') + s.sd.pace + ' min/km';
      } else if (s.id === 'arya') {
        var ex2 = [];
        if (s.sd.program) ex2.push(s.sd.program);
        if (s.sd.category) ex2.push(s.sd.category);
        if (s.sd.duration) ex2.push(s.sd.duration + ' min');
        extra = ex2.join(' · ');
      } else {
        var blk = null;
        for (var bi=0;bi<SCHEDULES.length;bi++) { if (SCHEDULES[bi].id===s.id) { blk=SCHEDULES[bi]; break; } }
        if (blk && blk.blocks) {
          var c = countDone(s.id, dateStr, blk.blocks);
          extra = c.done + '/' + c.tot + ' esercizi';
        }
      }
      var nameLabel = sessName(s.id, s.sd) + (s.id === 'arya' && s.idx > 1 ? ' <span style="font-size:11px;color:var(--ink3)">· Sessione ' + s.idx + '</span>' : '');
      var openHandler = (s.id === 'arya')
        ? 'loadAryaSess(\'' + dateStr + '\',' + (s.idx || 1) + ')'
        : 'goToSess(\'' + s.id + '\',\'' + dateStr + '\')';
      html += '<div class="day-sess">';
      html += '<div class="day-sess-dot ' + dotClass(s.id, s.sd) + '"></div>';
      // per ARYA il programma lo dice già la sigla: niente sottotitolo fisso
      html += '<div class="day-sess-name">' + nameLabel + (s.id === 'arya' ? '' : '<br><span style="font-size:11px;font-weight:400;color:var(--ink3)">' + meta.label + '</span>') + '</div>';
      html += '<div style="text-align:right">';
      if (extra) html += '<div class="day-sess-meta">' + extra + '</div>';
      if (stars) html += '<div class="day-sess-stars">' + stars + '</div>';
      html += '</div>';
      html += '<button class="day-sess-goto" onclick="' + openHandler + '">Apri →</button>';
      html += '</div>';
    }
  }
  var restActive = isRestDay(dateStr);
  html += '<button class="btn-small' + (restActive ? ' rest-on' : '') + '" style="margin-top:10px" onclick="toggleRestDay(\'' + dateStr + '\')">' + (restActive ? '✓ Giorno di riposo — rimuovi' : '🛌 Segna come giorno di riposo') + '</button>';
  html += '</div>';
  wrap.innerHTML = html;
  // il giorno toccato resta evidenziato, così si vede che il clic è arrivato
  var cells = document.querySelectorAll('.cal-day');
  for (var ci = 0; ci < cells.length; ci++) {
    var oc = cells[ci].getAttribute('onclick') || '';
    cells[ci].classList.toggle('selected', oc.indexOf("'" + dateStr + "'") !== -1);
  }
  wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function goToSess(sid, dateStr) {
  state['date_' + sid] = dateStr;
  saveState();
  currentTab = sid;
  if (CAROL_IDS.indexOf(sid) !== -1) carolCurrentSub = sid;
  renderTabs();
  renderMain();
}

/* ── STORICO COMPLETO ────────────────────────────────────────── */
function setStoricoFilter(f) {
  storicoFilter = f;
  renderStorico();
}

function renderStorico() {
  var filterIds = ['arya','s5']; // pulsanti filtro mostrati (le sessioni Carol restano in "Tutte", senza filtro proprio)
  var MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

  // 1. raccogli tutte le sessioni "reali"
  var all = [];
  for (var k in state) {
    var m = k.match(/^(s\d|arya)__(\d{4}-\d{2}-\d{2})(?:__(\d+))?$/);
    if (!m) continue;
    var sid = m[1], date = m[2], sd = state[k];
    var idx = m[3] ? parseInt(m[3]) : 1;

    var hasData = false;
    if (sd.rating && sd.rating > 0) hasData = true;
    if (sd.note && sd.note.trim()) hasData = true;
    if (sid === 's5' && (sd.km || sd.pace)) hasData = true;
    if (sid === 'arya' && (sd.program || sd.title || sd.category || sd.exercises || sd.duration)) hasData = true;
    if (sd.done) { for (var dk in sd.done) { if (sd.done[dk]) { hasData = true; break; } } }
    if (!hasData) continue;

    if (storicoFilter === 'carol') { if (CAROL_IDS.indexOf(sid) === -1) continue; }
    else if (storicoFilter !== 'all' && sid !== storicoFilter) continue;
    all.push({sid: sid, date: date, sd: sd, idx: idx});
  }

  // 2. ordina per data desc, poi per idx desc all'interno dello stesso giorno
  all.sort(function(a, b) {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return (b.idx || 1) - (a.idx || 1);
  });

  // 3. raggruppa per mese (YYYY-MM)
  var groups = {};
  for (var i = 0; i < all.length; i++) {
    var ym = all[i].date.slice(0, 7);
    if (!groups[ym]) groups[ym] = [];
    groups[ym].push(all[i]);
  }
  var groupKeys = Object.keys(groups).sort(function(a, b) { return b.localeCompare(a); });

  // 4. HTML
  var html = '';

  // header
  var filterLabel = storicoFilter === 'all' ? 'Tutte le sessioni' : (storicoFilter === 'carol' ? '📦 Archivio Carol' : SCHED_META[storicoFilter].name);
  html += '<div class="session-bar">';
  html += '<div class="session-info"><h2>Storico allenamenti</h2><p>' + all.length + ' session' + (all.length === 1 ? 'e' : 'i') + ' &middot; ' + filterLabel + '</p></div>';
  html += '</div>';

  // filtri
  html += '<div class="run-type-row" style="margin-bottom:1.25rem">';
  html += '<button class="run-type-btn' + (storicoFilter === 'all' ? ' active' : '') + '" onclick="setStoricoFilter(\'all\')">Tutte</button>';
  for (var fi = 0; fi < filterIds.length; fi++) {
    var f = filterIds[fi];
    var fLabel = (f === 'carol') ? '📦 Archivio Carol' : SCHED_META[f].name;
    html += '<button class="run-type-btn' + (storicoFilter === f ? ' active' : '') + '" onclick="setStoricoFilter(\'' + f + '\')">' + fLabel + '</button>';
  }
  html += '</div>';

  // lista
  if (!all.length) {
    html += '<div class="hist-empty" style="text-align:center;padding:2rem 0">Nessuna sessione registrata' + (storicoFilter !== 'all' ? ' per questa scheda' : '') + '.</div>';
  } else {
    for (var gi = 0; gi < groupKeys.length; gi++) {
      var gk = groupKeys[gi];
      var gParts = gk.split('-');
      var gMonth = MONTHS[parseInt(gParts[1]) - 1];
      var gItems = groups[gk];

      html += '<div class="hist-title" style="margin-top:' + (gi === 0 ? '0' : '1.5rem') + ';margin-bottom:.6rem">' + gMonth + ' ' + gParts[0] + ' &mdash; ' + gItems.length + ' session' + (gItems.length === 1 ? 'e' : 'i') + '</div>';

      for (var ii = 0; ii < gItems.length; ii++) {
        var it = gItems[ii];
        var meta = SCHED_META[it.sid];
        var p = it.date.split('-');
        var fmt = p[2] + '/' + p[1];
        var r = it.sd.rating || 0;
        var rStr = r ? '&#9733;'.repeat(r) : '&mdash;';

        // riepilogo
        var summary = '';
        if (it.sid === 's5') {
          var parts2 = [];
          if (it.sd.km) parts2.push(it.sd.km + ' km');
          if (it.sd.pace) parts2.push(it.sd.pace + ' min/km');
          if (it.sd.runType) parts2.push(it.sd.runType);
          summary = parts2.join(' · ');
        } else if (it.sid === 'arya') {
          var partsA = [];
          if (it.sd.program) partsA.push(it.sd.program);
          if (it.sd.title) partsA.push(it.sd.title);
          if (it.sd.category) partsA.push(it.sd.category);
          if (it.sd.duration) partsA.push(it.sd.duration + ' min');
          summary = partsA.join(' · ');
        } else {
          var blk = null;
          for (var bi = 0; bi < SCHEDULES.length; bi++) { if (SCHEDULES[bi].id === it.sid) { blk = SCHEDULES[bi]; break; } }
          if (blk && blk.blocks) {
            var c = countDone(it.sid, it.date, blk.blocks);
            summary = c.done + '/' + c.tot + ' esercizi · ' + blk.sub;
          }
        }

        var notePreview = '';
        if (it.sd.note) {
          var nText = it.sd.note.trim();
          notePreview = nText.length > 70 ? nText.slice(0, 70) + '…' : nText;
        }

        var clickHandler = (it.sid === 'arya')
          ? 'loadAryaSess(\'' + it.date + '\',' + (it.idx || 1) + ')'
          : 'goToSess(\'' + it.sid + '\',\'' + it.date + '\')';
        var sessSuffix = (it.sid === 'arya' && it.idx > 1) ? ' <span style="font-size:11px;font-weight:400;color:var(--ink3)">· Sessione ' + it.idx + '</span>' : '';
        html += '<div class="hist-item" style="cursor:pointer;align-items:flex-start" onclick="' + clickHandler + '">';
        html += '<div style="display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0">';
        html += '<div class="cal-dot ' + dotClass(it.sid, it.sd) + '" style="margin-top:5px;flex-shrink:0"></div>';
        html += '<div style="flex:1;min-width:0">';
        html += '<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">';
        html += '<span class="hist-date">' + fmt + '</span>';
        html += '<span style="font-size:13px;font-weight:500;color:var(--ink)">' + sessName(it.sid, it.sd) + sessSuffix + '</span>';
        html += '</div>';
        if (summary) html += '<div class="hist-meta">' + esc(summary) + '</div>';
        if (notePreview) html += '<div class="hist-meta" style="font-style:italic;margin-top:2px;color:var(--ink2)">&ldquo;' + esc(notePreview) + '&rdquo;</div>';
        html += '</div>';
        html += '</div>';
        html += '<div class="hist-right"><span class="hist-stars">' + rStr + '</span></div>';
        html += '</div>';
      }
    }
  }

  document.getElementById('main-content').innerHTML = html;
}

function renderTabs() {
  var html = '<button class="tab' + (currentTab === 'home' ? ' active' : '') + '" onclick="switchTab(\'home\')">📅 Panoramica</button>';
  html += '<button class="tab' + (currentTab === 'storico' ? ' active' : '') + '" onclick="switchTab(\'storico\')">📋 Storico</button>';
  for (var i = 0; i < SCHEDULES.length; i++) {
    var s = SCHEDULES[i];
    // le schede Carol non stanno nella barra: si aprono dal link "Archivio" in fondo alla Panoramica
    if (CAROL_IDS.indexOf(s.id) !== -1) continue;
    html += '<button class="tab' + (s.id === currentTab ? ' active' : '') + '" onclick="switchTab(\'' + s.id + '\')">' + s.name + '</button>';
  }
  document.getElementById('tabs-wrap').innerHTML = html;
}

function switchTab(id) {
  currentTab = id;
  if (CAROL_IDS.indexOf(id) !== -1) carolCurrentSub = id;
  renderTabs();
  if (id === 'home') renderHome();
  else if (id === 'storico') renderStorico();
  else renderMain();
}

function getRunSess(date) {
  var k = 's5__' + date;
  if (!state[k]) state[k] = {km:'', pace:'', runType:'', rating:0, note:'', effort:'', durationExact:''};
  return state[k];
}

function calcRunTime(km, pace) {
  // pace format mm:ss
  var km_n = parseFloat(km);
  if (!km_n || !pace) return '—';
  var parts = pace.split(':');
  if (parts.length !== 2) return '—';
  var mins = parseInt(parts[0]) + parseInt(parts[1]) / 60;
  if (isNaN(mins) || mins <= 0) return '—';
  var total = km_n * mins;
  var h = Math.floor(total / 60);
  var m = Math.floor(total % 60);
  var s = Math.round((total - Math.floor(total)) * 60);
  var str = '';
  if (h > 0) str += h + 'h ';
  str += m + '\' ';
  if (s > 0) str += s + '"';
  return str.trim() || '—';
}

function saveRun(field, val) {
  var d = getDate('s5');
  var rs = getRunSess(d);
  rs[field] = val;
  state['s5__' + d] = rs;
  saveState();
  // update computed fields live
  var km = document.getElementById('run-km') ? document.getElementById('run-km').value : rs.km;
  var pace = document.getElementById('run-pace') ? document.getElementById('run-pace').value : rs.pace;
  var t = document.getElementById('run-time-val');
  if (t) t.textContent = calcRunTime(km, pace);
}

function setRunType(type) {
  saveRun('runType', type);
  renderRunMain(null);
}

function setRunRating(n) {
  var d = getDate('s5');
  getRunSess(d).rating = n;
  state['s5__' + d] = getRunSess(d);
  saveState();
  renderRunMain(null);
}

function renderRunMain(sch) {
  if (!sch) {
    for (var i = 0; i < SCHEDULES.length; i++) {
      if (SCHEDULES[i].id === 's5') { sch = SCHEDULES[i]; break; }
    }
  }
  var dt = getDate('s5');
  var rs = getRunSess(dt);
  var types = ['Corsa continua', 'Interval run', 'Fartlek', 'Camminata attiva'];

  var html = '';
  html += '<div class="session-bar">';
  html += '<div class="session-info"><h2>Corsa outdoor</h2><p>Jolly settimanale</p></div>';
  html += '<div class="date-wrap"><label>Data sessione</label>';
  html += '<input type="date" id="sess-date" value="' + dt + '" onchange="onDateChange(this.value)"></div>';
  html += '</div>';

  // tipo di corsa
  html += '<div class="run-type-row">';
  for (var ti = 0; ti < types.length; ti++) {
    var active = rs.runType === types[ti] ? ' active' : '';
    html += '<button class="run-type-btn' + active + '" onclick="setRunType(\'' + types[ti] + '\')">' + types[ti] + '</button>';
  }
  html += '</div>';

  // stat grid
  html += '<div class="run-grid">';
  html += '<div class="run-stat"><div class="run-stat-label">Distanza</div>';
  html += '<input class="run-stat-input" id="run-km" type="number" step="0.1" min="0" placeholder="0.0" value="' + esc(rs.km || '') + '" oninput="saveRun(\'km\',this.value)">';
  html += '<div class="run-stat-unit">km</div></div>';

  html += '<div class="run-stat"><div class="run-stat-label">Ritmo medio</div>';
  html += '<input class="run-stat-input" id="run-pace" type="text" placeholder="5:30" value="' + esc(rs.pace || '') + '" oninput="saveRun(\'pace\',this.value)">';
  html += '<div class="run-stat-unit">min / km</div></div>';

  html += '<div class="run-stat computed" style="grid-column:1/-1"><div class="run-stat-label">Tempo totale stimato</div>';
  html += '<div class="run-stat-value" id="run-time-val">' + calcRunTime(rs.km, rs.pace) + '</div></div>';

  html += '<div class="run-stat"><div class="run-stat-label">Tempo esatto (Strava)</div>';
  html += '<input class="run-stat-input" id="run-duration-exact" type="text" placeholder="45:12" value="' + esc(rs.durationExact || '') + '" oninput="saveRun(\'durationExact\',this.value)">';
  html += '<div class="run-stat-unit">tempo reale registrato</div></div>';

  html += '<div class="run-stat"><div class="run-stat-label">Sforzo Relativo (Strava)</div>';
  html += '<input class="run-stat-input" id="run-effort" type="number" step="1" min="0" placeholder="85" value="' + esc(rs.effort || '') + '" oninput="saveRun(\'effort\',this.value)">';
  html += '<div class="run-stat-unit">Relative Effort</div></div>';
  html += '</div>';

  // feel card
  var starHtml = '';
  for (var si = 1; si <= 5; si++) {
    starHtml += '<span class="star' + ((rs.rating || 0) >= si ? ' on' : '') + '" onclick="setRunRating(' + si + ')">&#9733;</span>';
  }
  html += '<div class="feel-card">';
  html += '<div class="feel-title">Come è andata?</div>';
  html += '<div class="stars-row"><span class="stars-label">Energia / sforzo:</span><div class="stars">' + starHtml + '</div></div>';

  html += '<button class="btn btn-secondary" onclick="document.getElementById(\'import-input\').click()">&#8593; Ripristina dati</button>';

  html += '<span class="saved-ok" id="saved-ok">&#10003; Salvato!</span>';
  html += '</div>';

  // history
  html += '<div class="hist-section"><div class="hist-title">Sessioni precedenti</div>';
  var entries = [];
  for (var k in state) {
    if (k.indexOf('s5__') === 0) entries.push({date: k.replace('s5__',''), sd: state[k]});
  }
  entries.sort(function(a,b){ return b.date.localeCompare(a.date); });
  entries = entries.slice(0, 8);
  if (!entries.length) {
    html += '<div class="hist-empty">Nessuna corsa registrata ancora.</div>';
  } else {
    for (var ei = 0; ei < entries.length; ei++) {
      var e = entries[ei];
      var p = e.date.split('-');
      var fmt = p[2] + '/' + p[1] + '/' + p[0];
      var r = e.sd.rating || 0;
      var rStr = r ? '&#9733;'.repeat(r) : '&mdash;';
      var meta = [];
      if (e.sd.km) meta.push(e.sd.km + ' km');
      if (e.sd.pace) meta.push(e.sd.pace + ' min/km');
      if (e.sd.runType) meta.push(e.sd.runType);
      html += '<div class="hist-item">';
      html += '<div><div class="hist-date">' + fmt + '</div>';
      html += '<div class="hist-meta">' + (meta.length ? meta.join(' · ') : 'Nessun dato') + '</div></div>';
      html += '<div class="hist-right"><span class="hist-stars">' + rStr + '</span></div>';
      html += '</div>';
    }
  }
  html += '</div>';

  document.getElementById('main-content').innerHTML = html;
}

/* ── ARYA TRAINING ───────────────────────────────────────────── */
// Modello chiavi:
//   Sessione 1 del giorno: 'arya__YYYY-MM-DD'           (retro-compatibile)
//   Sessione 2 del giorno: 'arya__YYYY-MM-DD__2'
//   Sessione N del giorno: 'arya__YYYY-MM-DD__N'

function aryaKey(date, idx) {
  return (idx && idx > 1) ? ('arya__' + date + '__' + idx) : ('arya__' + date);
}

function aryaSessionHasData(sd) {
  if (!sd) return false;
  if (sd.program) return true;
  if (sd.title) return true;
  if (sd.category) return true;
  if (sd.exercises) return true;
  if (sd.duration) return true;
  if (sd.rating && sd.rating > 0) return true;
  if (sd.note && sd.note.trim()) return true;
  return false;
}

// Ritorna gli indici delle sessioni ARYA esistenti nel giorno (es. [1] o [1,2] o [1,2,3]).
function getAryaIndicesOfDay(date, includeIdx) {
  var found = {};
  for (var k in state) {
    var m = k.match(/^arya__(\d{4}-\d{2}-\d{2})(?:__(\d+))?$/);
    if (!m) continue;
    if (m[1] !== date) continue;
    var idx = m[2] ? parseInt(m[2]) : 1;
    if (aryaSessionHasData(state[k])) found[idx] = true;
    else if (idx === 1) found[1] = true; // mantieni lo slot 1 anche se vuoto (è il default)
  }
  if (includeIdx) found[includeIdx] = true; // la sessione appena creata resta visibile anche se ancora vuota
  var arr = Object.keys(found).map(function(n){ return parseInt(n); }).sort(function(a,b){ return a-b; });
  if (!arr.length) arr = [1];
  return arr;
}

function getAryaSess(date, idx) {
  if (!idx) idx = 1;
  var k = aryaKey(date, idx);
  if (!state[k]) state[k] = {program:'', title:'', category:'', duration:'', exercises:'', rating:0, note:''};
  return state[k];
}

function getAryaDayNumber(date, idx) {
  // Conta tutte le sessioni ARYA con dati reali da ARYA_START_DATE fino al punto (date, idx) — incluso.
  if (date < ARYA_START_DATE) return null;
  if (!idx) idx = 1;
  var count = 0;
  for (var k in state) {
    var m = k.match(/^arya__(\d{4}-\d{2}-\d{2})(?:__(\d+))?$/);
    if (!m) continue;
    var d2 = m[1];
    var i2 = m[2] ? parseInt(m[2]) : 1;
    if (d2 < ARYA_START_DATE) continue;
    if (d2 > date) continue;
    if (d2 === date && i2 > idx) continue;
    if (aryaSessionHasData(state[k])) count++;
  }
  // Se la sessione corrente è ancora vuota, mostra il prossimo numero
  var currentSd = state[aryaKey(date, idx)];
  if (!aryaSessionHasData(currentSd)) return count + 1;
  return count;
}

function addAryaSession() {
  var d = getDate('arya');
  var indices = getAryaIndicesOfDay(d);
  var nextIdx = Math.max.apply(null, indices) + 1;
  aryaCurrentIdx = nextIdx;
  getAryaSess(d, aryaCurrentIdx); // crea lo slot vuoto
  saveLocalOnly();
  renderAryaMain(null);
}

function selectAryaSession(idx) {
  aryaCurrentIdx = idx;
  renderAryaMain(null);
}

function saveArya(field, val) {
  var d = getDate('arya');
  var s = getAryaSess(d, aryaCurrentIdx);
  s[field] = val;
  state[aryaKey(d, aryaCurrentIdx)] = s;
  saveLocalOnly();
}

function setAryaRating(n) {
  var d = getDate('arya');
  var s = getAryaSess(d, aryaCurrentIdx);
  s.rating = n;
  state[aryaKey(d, aryaCurrentIdx)] = s;
  saveState();
  renderAryaMain(null);
}

function renderAryaMain(sch) {

    html += '<button class="run-type-btn' + active + '" onclick="selectAryaSession(' + di + ')">Sessione ' + di + '</button>';
  }
  html += '<button class="run-type-btn" style="border-style:dashed" onclick="addAryaSession()">+ Nuova sessione del giorno</button>';
  html += '</div>';

  html += '<div class="arya-card">';
  html += '<div class="arya-card-label">Programma / Raccolta ARYA</div>';

  html += '</div>';

  html += '<div class="arya-card-label">Titolo workout</div>';

    var c = ARYA_CATS[ci];
    html += '<option value="' + esc(c) + '"' + (s.category === c ? ' selected' : '') + '>' + esc(c) + '</option>';
  }
  html += '</select></div>';
  html += '<div><div class="arya-card-label">Durata (min)</div>';

  // esercizi

  html += '<div class="arya-card-label">Esercizi (a mano libera)</div>';

  html += '</div>';

  // feel card
  var starHtml = '';
  for (var si = 1; si <= 5; si++) {
    starHtml += '<span class="star' + ((s.rating || 0) >= si ? ' on' : '') + '" onclick="setAryaRating(' + si + ')">&#9733;</span>';
  }
  html += '<div class="feel-card">';
  html += '<div class="feel-title">Come è andata?</div>';
  html += '<div class="stars-row"><span class="stars-label">Energia / sforzo:</span><div class="stars">' + starHtml + '</div></div>';
  html += '<textarea class="note-area" id="session-note" placeholder="Sensazioni, energia, intensità percepita, cosa ricordare..." oninput="saveArya(\'note\',this.value)">' + esc(s.note || '') + '</textarea>';
  html += '</div>';

  // azioni
  html += '<div class="actions">';
  html += '<button class="btn btn-primary" onclick="doSave()">Salva sessione</button>';
  html += '<button class="btn btn-secondary" onclick="doExportJSON()">&#8595; Backup dati</button>';
  html += '<button class="btn btn-secondary" onclick="document.getElementById(\'import-input\').click()">&#8593; Ripristina dati</button>';
  html += '<input type="file" id="import-input" accept=".json" style="display:none" onchange="doImportJSON(this)">';
  html += '<span class="saved-ok" id="saved-ok">&#10003; Salvato!</span>';

  // storico ARYA — include sessioni multiple per giorno
  html += '<div class="hist-section"><div class="hist-title">Sessioni precedenti ARYA</div>';
  var entries = [];
  for (var k in state) {
    var mm = k.match(/^arya__(\d{4}-\d{2}-\d{2})(?:__(\d+))?$/);
    if (!mm) continue;
    var sd2 = state[k];
    if (!aryaSessionHasData(sd2)) continue;
    entries.push({date: mm[1], idx: mm[2] ? parseInt(mm[2]) : 1, sd: sd2});
  }
  entries.sort(function(a,b){
    if (a.date !== b.date) return b.date.localeCompare(a.date);

  });

  if (!entries.length) {
    html += '<div class="hist-empty">Nessuna sessione ARYA registrata ancora.</div>';
  } else {
    for (var ei = 0; ei < entries.length; ei++) {
      var e = entries[ei];
      var p = e.date.split('-');

      var r = e.sd.rating || 0;
      var rStr = r ? '&#9733;'.repeat(r) : '&mdash;';
      var meta = [];
      if (e.sd.program) meta.push(e.sd.program);
      if (e.sd.title) meta.push(e.sd.title);
      if (e.sd.category) meta.push(e.sd.category);
      if (e.sd.duration) meta.push(e.sd.duration + ' min');
      var sessLabel = (e.idx > 1) ? ' <span style="font-size:11px;color:var(--ink3)">· Sessione ' + e.idx + '</span>' : '';
      html += '<div class="hist-item">';
      html += '<div><div class="hist-date">' + fmt + sessLabel + '</div>';
      html += '<div class="hist-meta">' + (meta.length ? esc(meta.join(' · ')) : 'Nessun dato') + '</div></div>';
      html += '<div class="hist-right"><span class="hist-stars">' + rStr + '</span>';
      html += '<button class="btn-small" onclick="loadAryaSess(\'' + e.date + '\',' + e.idx + ')">Vedi</button></div>';
      html += '</div>';
    }
  }
  html += '</div>';

  document.getElementById('main-content').innerHTML = html;
}

function renderMain() {
  var sch = null;
  for (var i = 0; i < SCHEDULES.length; i++) {
    if (SCHEDULES[i].id === currentTab) { sch = SCHEDULES[i]; break; }
  }
  if (!sch) return;
  if (sch.runMode) { renderRunMain(sch); return; }
  if (sch.aryaMode) { renderAryaMain(sch); return; }

  var dt = getDate(currentTab);

  // Se la scheda è stata appena salvata e resettata, usa una sessione vuota fittizia
  var sd;
  if (_freshTabs[currentTab]) {
    sd = {done:{}, weights:{}, exnotes:{}, rating:0, note:''};
  } else {
    sd = getSess(currentTab, dt);
  }

  var c = countDone(currentTab, dt, sch.blocks);
  // Se fresh, progress bar a zero
  if (_freshTabs[currentTab]) c = {tot: c.tot, done: 0};
  var pct = c.tot ? Math.round(c.done / c.tot * 100) : 0;

  var html = '';

  html += '<div class="session-bar">';
  html += '<div class="session-info"><h2>' + sch.name + '</h2><p>' + sch.sub + '</p></div>';
  html += '<div class="date-wrap"><label>Data sessione</label>';
  html += '<input type="date" id="sess-date" value="' + dt + '" onchange="onDateChange(this.value)"></div>';
  html += '</div>';

  if (CAROL_IDS.indexOf(sch.id) !== -1) {
    html += '<div class="run-type-row" style="margin-bottom:10px">';
    for (var cci = 0; cci < CAROL_IDS.length; cci++) {
      var cid = CAROL_IDS[cci];
      var csch = null;
      for (var csi = 0; csi < SCHEDULES.length; csi++) { if (SCHEDULES[csi].id === cid) { csch = SCHEDULES[csi]; break; } }
      var cactive = (cid === sch.id) ? ' active' : '';
      html += '<button class="run-type-btn' + cactive + '" onclick="switchTab(\'' + cid + '\')">' + csch.name + '</button>';
    }
    html += '</div>';
  }

  html += '<div class="prog-wrap">';
  html += '<div class="prog-labels"><span>' + c.done + ' / ' + c.tot + ' esercizi</span><span>' + pct + '%</span></div>';
  html += '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%"></div></div>';
  html += '</div>';

  for (var bi = 0; bi < sch.blocks.length; bi++) {
    var b = sch.blocks[bi];
    html += '<div class="card">';
    html += '<div class="card-head">';
    if (b.sup) html += '<span class="card-badge">Superserie ' + b.sup + '</span>';
    html += '<span class="card-title">' + b.title + '</span>';
    if (b.note) html += '<span class="card-note">' + b.note + '</span>';
    html += '</div>';

    for (var ei = 0; ei < b.exercises.length; ei++) {
      var e = b.exercises[ei];
      var key = b.title + '_' + ei;
      var isDone = !!(sd.done && sd.done[key]);
      var w = (sd.weights && sd.weights[key]) ? esc(sd.weights[key]) : '';
      var n = (sd.exnotes && sd.exnotes[key]) ? esc(sd.exnotes[key]) : '';
      var btag = 'b' + bi + 'e' + ei;

      html += '<div class="ex">';
      html += '<div class="chk' + (isDone ? ' done' : '') + '" onclick="toggleDone(' + bi + ',' + ei + ')">';
      html += '<div class="chk-icon"></div></div>';
      html += '<div>';
      html += '<div class="ex-name' + (isDone ? ' done' : '') + '">' + e.name + '</div>';
      html += '<div class="ex-desc">' + e.meta;
      if (e.kg) html += ' &nbsp;&middot;&nbsp; <b>' + e.kg + ' kg</b>';
      html += '</div>';
      html += '<div class="ex-fields">';
      if (e.kg) {
        html += '<div class="fld"><div class="fld-label">Peso usato</div>';
        html += '<input type="text" id="w_' + btag + '" placeholder="es. 8 kg" value="' + w + '" oninput="saveW(' + bi + ',' + ei + ',this.value)"></div>';
      }
      html += '<div class="fld"><div class="fld-label">Note esercizio</div>';
      html += '<input type="text" id="n_' + btag + '" placeholder="sensazioni, difficolta\'..." value="' + n + '" oninput="saveN(' + bi + ',' + ei + ',this.value)"></div>';
      html += '</div></div></div>';
    }
    html += '</div>';
  }

  var starHtml = '';
  for (var si = 1; si <= 5; si++) {
    starHtml += '<span class="star' + ((sd.rating || 0) >= si ? ' on' : '') + '" onclick="setRating(' + si + ')">&#9733;</span>';
  }
  html += '<div class="feel-card">';
  html += '<div class="feel-title">Come e\' andata?</div>';
  html += '<div class="stars-row"><span class="stars-label">Energia / sforzo:</span><div class="stars">' + starHtml + '</div></div>';
  html += '<textarea class="note-area" id="session-note" placeholder="Note generali: come ti sei sentita, cosa e\' migliorato, cosa ricordare..." oninput="saveGenNote(this.value)">' + esc(sd.note || '') + '</textarea>';
  html += '</div>';

  html += '<div class="actions">';
  html += '<button class="btn btn-primary" onclick="doSave()">Salva sessione</button>';
  html += '<button class="btn btn-secondary" onclick="doExportJSON()">&#8595; Backup dati</button>';
  html += '<button class="btn btn-secondary" onclick="document.getElementById(\'import-input\').click()">&#8593; Ripristina dati</button>';
  html += '<input type="file" id="import-input" accept=".json" style="display:none" onchange="doImportJSON(this)">';
  html += '<span class="saved-ok" id="saved-ok">&#10003; Salvato!</span>';
  html += '</div>';

  html += renderHistory(sch);

  html += '<div class="info-box" style="margin-top:1.25rem"><div class="info-box-title">Opzioni cardio (Plus)</div><ul>';
  for (var ci = 0; ci < CARDIO.length; ci++) html += '<li>' + CARDIO[ci] + '</li>';
  html += '</ul></div>';

  html += '<div class="info-box"><div class="info-box-title">Consigli generali</div><ul>';
  for (var ti = 0; ti < TIPS.length; ti++) html += '<li>' + TIPS[ti] + '</li>';
  html += '</ul></div>';

  document.getElementById('main-content').innerHTML = html;
}

function renderHistory(sch) {
  var entries = [];
  for (var k in state) {
    if (k.indexOf(sch.id + '__') === 0) {
      entries.push({date: k.replace(sch.id + '__', ''), sd: state[k]});
    }
  }
  entries.sort(function(a, b) { return b.date.localeCompare(a.date); });
  entries = entries.slice(0, 8);

  var html = '<div class="hist-section"><div class="hist-title">Sessioni precedenti</div>';
  if (!entries.length) {
    html += '<div class="hist-empty">Nessuna sessione registrata ancora.</div>';
  } else {
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var c = countDone(sch.id, e.date, sch.blocks);
      var r = e.sd.rating || 0;
      var rStr = r ? '&#9733;'.repeat(r) : '&mdash;';
      var p = e.date.split('-');
      var fmt = p[2] + '/' + p[1] + '/' + p[0];
      var preview = e.sd.note ? e.sd.note.slice(0, 40) + (e.sd.note.length > 40 ? '...' : '') : '';
      html += '<div class="hist-item">';
      html += '<div><div class="hist-date">' + fmt + '</div>';
      html += '<div class="hist-meta">' + c.done + '/' + c.tot + ' esercizi' + (preview ? ' &middot; ' + esc(preview) : '') + '</div></div>';
      html += '<div class="hist-right"><span class="hist-stars">' + rStr + '</span>';
      html += '<button class="btn-small" onclick="loadSess(\'' + e.date + '\')">Vedi</button></div>';
      html += '</div>';
    }
  }
  return html + '</div>';
}

function onDateChange(val) {
  state['date_' + currentTab] = val;
  if (currentTab === 'arya') aryaCurrentIdx = 1; // ogni nuovo giorno reparte da slot 1
  saveState();
  renderMain();
}

function loadSess(date) {
  state['date_' + currentTab] = date;
  saveState();
  renderMain();
}

function loadAryaSess(date, idx) {
  state['date_arya'] = date;
  aryaCurrentIdx = idx || 1;
  saveLocalOnly();
  currentTab = 'arya';
  renderTabs();
  renderAryaMain(null);
}

function toggleDone(bi, ei) {
  _freshTabs[currentTab] = false; // prima interazione: esci dalla modalità "fresh"
  var sch = null;
  for (var i = 0; i < SCHEDULES.length; i++) {
    if (SCHEDULES[i].id === currentTab) { sch = SCHEDULES[i]; break; }
  }
  var b = sch.blocks[bi];
  var key = b.title + '_' + ei;
  var dt = getDate(currentTab);
  var sd = getSess(currentTab, dt);
  if (!sd.done) sd.done = {};
  sd.done[key] = !sd.done[key];
  saveLocalOnly();
  renderMain();
}

function saveW(bi, ei, val) {
  _freshTabs[currentTab] = false;
  var sch = null;
  for (var i = 0; i < SCHEDULES.length; i++) {
    if (SCHEDULES[i].id === currentTab) { sch = SCHEDULES[i]; break; }
  }
  var b = sch.blocks[bi];
  var key = b.title + '_' + ei;
  var sd = getSess(currentTab, getDate(currentTab));
  if (!sd.weights) sd.weights = {};
  sd.weights[key] = val;
  saveLocalOnly();
}

function saveN(bi, ei, val) {
  _freshTabs[currentTab] = false;
  var sch = null;
  for (var i = 0; i < SCHEDULES.length; i++) {
    if (SCHEDULES[i].id === currentTab) { sch = SCHEDULES[i]; break; }
  }
  var b = sch.blocks[bi];
  var key = b.title + '_' + ei;
  var sd = getSess(currentTab, getDate(currentTab));
  if (!sd.exnotes) sd.exnotes = {};
  sd.exnotes[key] = val;
  saveLocalOnly();
}

function saveGenNote(val) {
  _freshTabs[currentTab] = false;
  getSess(currentTab, getDate(currentTab)).note = val;
  saveLocalOnly();
}

function setRating(n) {
  getSess(currentTab, getDate(currentTab)).rating = n;
  saveState();
  renderMain();
}

function doSave() {
  // Raccoglie i valori testuali live dal DOM prima di salvare
  var sch = null;
  for (var i = 0; i < SCHEDULES.length; i++) {
    if (SCHEDULES[i].id === currentTab) { sch = SCHEDULES[i]; break; }
  }
  if (sch && !sch.runMode && !sch.aryaMode) {
    var dt = getDate(currentTab);
    var sd = getSess(currentTab, dt);
    for (var bi = 0; bi < sch.blocks.length; bi++) {
      var b = sch.blocks[bi];
      for (var ei = 0; ei < b.exercises.length; ei++) {
        var btag = 'b' + bi + 'e' + ei;
        var wEl = document.getElementById('w_' + btag);
        var nEl = document.getElementById('n_' + btag);
        var key = b.title + '_' + ei;
        if (wEl) { if (!sd.weights) sd.weights = {}; sd.weights[key] = wEl.value; }
        if (nEl) { if (!sd.exnotes) sd.exnotes = {}; sd.exnotes[key] = nEl.value; }
      }
    }
    var noteEl = document.getElementById('session-note');
    if (noteEl) sd.note = noteEl.value;
  }

  saveState(); // salva sul dispositivo e nel database

  var el = document.getElementById('saved-ok');
  if (el) {
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 2000);
  }

  // ── RESET SCHEDA ──
  // Segna questa scheda come "fresca": il prossimo render mostrerà form vuoto.
  // I dati salvati restano nel database e nello storico.
  // NB: solo per le schede Carol (s1-s4); ARYA e Corsa restano visibili dopo il save.
  if (sch && !sch.runMode && !sch.aryaMode) {
    setTimeout(function() {
      _freshTabs[currentTab] = true;          // flag: mostra form vuoto
      delete state['date_' + currentTab];     // prossima apertura = data odierna
      saveLocalOnly();
      renderMain();
    }, 800);
  }
}

function doExport() {
  var lines = ['SCHEDA ALLENAMENTO - GIORGIA - GENNAIO', 'Carol Enrico', '', ''];
  for (var si = 0; si < SCHEDULES.length; si++) {
    var sch = SCHEDULES[si];
    var sessKeys = [];
    for (var k in state) {
      if (k.indexOf(sch.id + '__') === 0) sessKeys.push(k);
    }
    if (!sessKeys.length) continue;
    lines.push('=== ' + sch.name.toUpperCase() + ' - ' + sch.sub.toUpperCase() + ' ===');
    sessKeys.sort();
    for (var ki = 0; ki < sessKeys.length; ki++) {
      var date = sessKeys[ki].replace(sch.id + '__', '');
      var sd = state[sessKeys[ki]];
      var p = date.split('-');
      lines.push('');
      lines.push('Data: ' + p[2] + '/' + p[1] + '/' + p[0]);
      for (var bi = 0; bi < sch.blocks.length; bi++) {
        var b = sch.blocks[bi];
        lines.push('  ' + b.title + ':');
        for (var ei = 0; ei < b.exercises.length; ei++) {
          var e = b.exercises[ei];
          var key = b.title + '_' + ei;
          var done = (sd.done && sd.done[key]) ? '[X]' : '[ ]';
          var w = (sd.weights && sd.weights[key]) ? ' - ' + sd.weights[key] : '';
          var n = (sd.exnotes && sd.exnotes[key]) ? ' -> ' + sd.exnotes[key] : '';
          lines.push('    ' + done + ' ' + e.name + ' (' + e.meta.replace(/&middot;/g,'·').replace(/&mdash;/g,'—') + ')' + w + n);
        }
      }
      if (sd.rating) lines.push('  Energia: ' + '★'.repeat(sd.rating));
      if (sd.note) lines.push('  Note: ' + sd.note);
    }
    lines.push('');
  }
  var content = lines.join('\n');
  var blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'allenamento_giorgia_' + todayStr() + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function doExportJSON() {
  var blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'giorgia_backup_' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function doImportJSON(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var imported = JSON.parse(e.target.result);
      // Merge: i dati importati sovrascrivono quelli esistenti, il resto rimane
      for (var k in imported) { state[k] = imported[k]; }
      saveState();
      renderMain();
      var el = document.getElementById('saved-ok');
      if (el) { el.textContent = '✓ Dati ripristinati!'; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); el.textContent = '✓ Salvato!'; }, 2500); }
    } catch(err) {
      alert('File non valido. Assicurati di selezionare un backup JSON generato da questa scheda.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

loadState();   // render immediato dai dati del dispositivo, poi sincronizza con il database
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(e) { console.warn('TRAIN: niente modalità offline', e); });
renderTabs();
renderHome();
</script>
